name: Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            wordpress: '6.8'
            coverage: false
          - php: '8.2'
            wordpress: latest
            coverage: true
          - php: '8.4'
            wordpress: latest
            coverage: false
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: mailgate_test
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium
          tools: composer:v2
          coverage: ${{ matrix.coverage && 'xdebug' || 'none' }}
      - run: composer install --prefer-dist --no-interaction --no-progress
      - run: composer validate --strict
      - run: composer cs
      - name: Audit shipped Composer dependencies for known vulnerabilities
        if: matrix.coverage
        # Composer errors instead of skipping when the lock file has no runtime packages.
        run: |
          if [ "$(php -r 'echo count(json_decode(file_get_contents("composer.lock"), true)["packages"]);')" = 0 ]; then
            echo 'No runtime Composer packages are shipped; nothing to audit.'
          else
            composer audit --locked --no-dev
          fi
      - name: PHPStan level 8
        if: matrix.coverage
        run: composer stan
      - name: Install WordPress test files
        env:
          WP_VERSION: ${{ matrix.wordpress }}
        run: |
          if [ "$WP_VERSION" = latest ]; then
            curl --fail --location --retry 3 https://wordpress.org/latest.tar.gz -o /tmp/wordpress.tar.gz
          else
            curl --fail --location --retry 3 "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" -o /tmp/wordpress.tar.gz
          fi
          tar -xzf /tmp/wordpress.tar.gz -C /tmp
      - name: Run all regression scenarios
        env:
          WP_ROOT: /tmp/wordpress
          WP_DB_HOST: 127.0.0.1:3306
          COLLECT_COVERAGE: ${{ matrix.coverage }}
          XDEBUG_MODE: coverage
        run: |
          if [ "$COLLECT_COVERAGE" = true ]; then
            php tests/run.php --coverage
          else
            php tests/run.php
          fi
      - name: Upload Clover coverage
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: php-coverage
          path: coverage/clover.xml
          if-no-files-found: error
          retention-days: 14
      - name: Enforce PHP line coverage > 80 %
        if: matrix.coverage
        run: php tests/coverage/check.php coverage/clover.xml PHP

  javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - run: npm ci --no-audit --no-fund
      - name: Audit shipped npm dependencies for known vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Run JavaScript tests and enforce line coverage > 80 %
        run: npm run coverage:js
      - name: Upload LCOV coverage
        uses: actions/upload-artifact@v4
        with:
          name: js-coverage
          path: coverage/js/lcov.info
          if-no-files-found: error
          retention-days: 14

  sonarqube:
    name: SonarQube Cloud
    needs: [integration, javascript]
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'push' &&
       github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: php-coverage
          path: coverage
      - uses: actions/download-artifact@v4
        with:
          name: js-coverage
          path: coverage/js
      - name: Check SonarQube configuration
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo '::error::Set the SONAR_TOKEN repository secret before running SonarQube analysis.'
            exit 1
          fi
          if [ -z "$SONAR_ORGANIZATION" ]; then
            echo '::error::Set the SONAR_ORGANIZATION repository variable to your SonarQube Cloud organization key.'
            exit 1
          fi
          test -s coverage/clover.xml
          test -s coverage/js/lcov.info
      - name: Analyze code and import coverage
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
