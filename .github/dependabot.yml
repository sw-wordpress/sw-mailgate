version: 2
# One PR per group: security fixes together, then routine updates per ecosystem.
# Majors outside these groups still arrive individually, since they may need migration work.
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      composer-security:
        applies-to: security-updates
        patterns: ['*']
      composer-dev-tools:
        dependency-type: development
        update-types: [minor, patch]

  # Development-only JavaScript test tooling (c8).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-security:
        applies-to: security-updates
        patterns: ['*']
      npm-dev-tools:
        dependency-type: development
        update-types: [minor, patch, major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ['*']
        update-types: [minor, patch, major]
