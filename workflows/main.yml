name: Build release zip

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

env:
  PLUGIN_SLUG: sw-mailgate

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine repository name and version
        id: metadata
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          RAW="${GITHUB_REF_NAME}"
          VERSION="${RAW#v}"
          VERSION="${VERSION%-*}"

          echo "repo=$REPO_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "zip=${REPO_NAME}-${VERSION}.zip" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer:v2
          coverage: none

      - name: Validate Composer configuration
        run: composer validate --strict

      - name: Install production dependencies
        run: |
          composer install \
            --no-dev \
            --prefer-dist \
            --no-interaction \
            --no-progress \
            --no-scripts \
            --optimize-autoloader

      - name: Smoke-test source checkout
        run: |
          php tests/bootstrap.php
          php tests/uninstall.php . delete
          php tests/uninstall.php . preserve
          php tests/uninstall.php . default

      - name: Isolate dependencies with Mozart
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE:/project" \
            coenjacobs/mozart:1.2.3 \
            /mozart/bin/mozart compose

      - name: Verify Mozart output
        run: test -f vendor-prefixed/autoload.php

      - name: Bundle WordPress plugin
        env:
          REPO_NAME: ${{ steps.metadata.outputs.repo }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          STAGING="$RUNNER_TEMP/staging/$PLUGIN_SLUG"

          mkdir -p "$STAGING"

          # Ship only the isolated libraries, never Composer's original vendor tree.
          rsync -a \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.gitignore' \
            --exclude='/.editorconfig' \
            --exclude='/.phpcs.cache' \
            --exclude='/vendor/' \
            --exclude='/tests/' \
            --exclude='/coverage/' \
            --exclude='/.scannerwork/' \
            --exclude='/sonar-project.properties' \
            --exclude='/node_modules/' \
            --exclude='/.env*' \
            --exclude='*.log' \
            --exclude='*.zip' \
            --exclude='/composer.json' \
            --exclude='/composer.lock' \
            --exclude='/phpcs.xml*' \
            ./ "$STAGING/"

          # Prove that the plugin boots without the original vendor directory.
          php tests/bootstrap.php "$STAGING"

          # Keep the installed plugin slug stable, even if the repository is renamed.
          (
            cd "$RUNNER_TEMP/staging"
            zip -qr "$GITHUB_WORKSPACE/${REPO_NAME}-${VERSION}.zip" "$PLUGIN_SLUG"
          )

      - name: Verify ZIP contents
        env:
          ZIP_FILE: ${{ steps.metadata.outputs.zip }}
        run: |
          unzip -t "$ZIP_FILE"
          unzip -Z1 "$ZIP_FILE" > "$RUNNER_TEMP/zip-contents.txt"
          grep -Fx "$PLUGIN_SLUG/vendor-prefixed/autoload.php" "$RUNNER_TEMP/zip-contents.txt"
          grep -Fx "$PLUGIN_SLUG/sw-mailgate.php" "$RUNNER_TEMP/zip-contents.txt"
          if grep -Eq "^$PLUGIN_SLUG/(vendor|tests|\.git|\.github)/" "$RUNNER_TEMP/zip-contents.txt"; then
            echo "Unexpected development or unprefixed vendor files in ZIP" >&2
            exit 1
          fi

      - name: Smoke-test uninstall from release ZIP
        env:
          ZIP_FILE: ${{ steps.metadata.outputs.zip }}
        run: |
          EXTRACTED="$RUNNER_TEMP/uninstall-release"
          unzip -q "$ZIP_FILE" -d "$EXTRACTED"
          php tests/uninstall.php "$EXTRACTED/$PLUGIN_SLUG" delete
          php tests/uninstall.php "$EXTRACTED/$PLUGIN_SLUG" preserve
          php tests/uninstall.php "$EXTRACTED/$PLUGIN_SLUG" default

      - name: Create release and attach ZIP
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.metadata.outputs.version }}
          files: ${{ steps.metadata.outputs.zip }}
